<div class="contact-container">
  <div class="contact-content">
    <h1>Contact Us</h1>
    <p>Have questions or suggestions? We'd love to hear from you!</p>

    <form class="contact-form" (ngSubmit)="onSubmit()" #contactForm="ngForm">
      <div class="form-group">
        <label for="name">Name</label>
        <input
          type="text"
          id="name"
          name="name"
          [(ngModel)]="contactData.name"
          required
          #name="ngModel"
        >
        <div class="error-message" *ngIf="name.invalid && (name.dirty || name.touched)">
          Name is required
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="contactData.email"
          required
          email
          #email="ngModel"
        >
        <div class="error-message" *ngIf="email.invalid && (email.dirty || email.touched)">
          Please enter a valid email address
        </div>
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea
          id="message"
          name="message"
          [(ngModel)]="contactData.message"
          required
          #message="ngModel"
          rows="5"
        ></textarea>
        <div class="error-message" *ngIf="message.invalid && (message.dirty || message.touched)">
          Message is required
        </div>
      </div>

      <button type="submit" [disabled]="contactForm.invalid">Send Message</button>
    </form>
  </div>
</div>
